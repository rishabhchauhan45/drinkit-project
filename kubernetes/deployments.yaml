apiVersion: apps/v1
kind: Deployment
metadata:
  name: drinkit-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drinkit-backend
  template:
    metadata:
      labels:
        app: drinkit-backend
    spec:
      containers:
      - name: backend
        image: drinkit-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres:5432/drinkit"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/drinkit"
        - name: REDIS_URL
          value: "redis://redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drinkit-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drinkit-frontend
  template:
    metadata:
      labels:
        app: drinkit-frontend
    spec:
      containers:
      - name: frontend
        image: drinkit-frontend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:5000/api"
