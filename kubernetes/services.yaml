apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: drinkit-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: drinkit-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
